plugins {
    id 'java'
    id 'maven-publish'
}

group = System.getenv('GROUP') ?: 'net.sixik.sam'
version = System.getenv('VERSION') ?: '1.0-SNAPSHOT'
description = 'Concurrent primitive collections and utilities.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

sourceSets {
    benchmark {
        java.srcDir file('src/benchmark/java')
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    benchmarkImplementation.extendsFrom implementation
    benchmarkRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'it.unimi.dsi:fastutil:8.5.15'

    benchmarkImplementation 'it.unimi.dsi:fastutil:8.5.15'
    benchmarkImplementation 'com.trivago:fastutil-concurrent-wrapper:0.2.2'
    benchmarkImplementation 'org.jctools:jctools-core:4.0.5'
    benchmarkImplementation 'org.openjdk.jmh:jmh-core:1.37'
    benchmarkAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'

    implementation "org.jetbrains:annotations:26.1.0"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = System.getenv('ARTIFACT') ?: project.name

            pom {
                name = 'ConcurrentLibrary'
                description = project.description
                url = 'https://github.com/Team-Argentum/ConcurrentLibrary'

                developers {
                    developer {
                        id = 'Team-Argentum'
                        name = 'Team Argentum'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/Team-Argentum/ConcurrentLibrary.git'
                    developerConnection = 'scm:git:https://github.com/Team-Argentum/ConcurrentLibrary.git'
                    url = 'https://github.com/Team-Argentum/ConcurrentLibrary'
                }
            }
        }
    }
}

tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Runs JMH benchmarks. Override with -PbenchmarkInclude=..., -PbenchmarkArgs="...", -PbenchmarkResultFormat=..., and -PbenchmarkResultFile=... .'
    dependsOn benchmarkClasses
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'

    def include = providers.gradleProperty('benchmarkInclude').orElse('Long2IntBenchmark|Long2ReferenceMapConcurrentBenchmark|Long2IntStressBenchmark|Long2ReferenceStressBenchmark|ChunkMapBenchmark|ChunkMapMinecraftBenchmark')
    def extraArgs = providers.gradleProperty('benchmarkArgs').orElse('')
    def resultFormat = providers.gradleProperty('benchmarkResultFormat').orElse('json')
    def resultFileOverride = providers.gradleProperty('benchmarkResultFile')
    def defaultResultFile = layout.buildDirectory.file("reports/jmh/results.${resultFormat.get()}")
    doFirst {
        def outputFile = resultFileOverride.isPresent()
                ? file(resultFileOverride.get())
                : defaultResultFile.get().asFile
        outputFile.parentFile.mkdirs()
    }
    args include.get()
    args '-rf', resultFormat.get()
    args '-rff', (resultFileOverride.isPresent()
            ? file(resultFileOverride.get()).absolutePath
            : defaultResultFile.get().asFile.absolutePath)
    if (!extraArgs.get().isBlank()) {
        args extraArgs.get().split(' ')
    }
}

